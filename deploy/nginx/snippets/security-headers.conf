# Header keamanan dasar. Di-include ulang di location yang memakai add_header sendiri,
# karena Nginx tidak mewarisi add_header dari level server ke location tersebut.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# $hsts_header didefinisikan lewat map di default.conf / https.conf (kosong = header tidak dikirim)
add_header Strict-Transport-Security $hsts_header always;
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
