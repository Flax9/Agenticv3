# Isi aplikasi yang sama untuk server HTTP (laptop) dan HTTPS (masterplan 8.4).

client_max_body_size 100M;
server_tokens off;

# 1. Hasil build React (dist/). index.html tidak di-cache agar versi baru langsung dipakai.
location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
}

# Aset Vite bernama hash: aman di-cache lama
location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
}

# 2. API FastAPI
location /api/ {
    proxy_pass http://web:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Ekstraksi & generate dokumen bisa beberapa menit. Timeout ini berlaku per jeda baca,
    # dan stream chat mengirim heartbeat tiap 15 detik, jadi giliran agent yang lebih lama tetap aman.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;

    # SSE: token harus langsung diteruskan, tidak ditahan di buffer Nginx
    proxy_buffering off;
    proxy_cache off;
}

# 3. Swagger (/docs, /openapi.json) tidak diekspos: FastAPI hanya mengaktifkannya saat DEBUG=True.
