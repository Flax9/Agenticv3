# Mode Cloudflare Tunnel (lihat compose.tunnel.yml dan deploy/cloudflare/README.md).
# Nginx hanya menerima lalu lintas dari container cloudflared di jaringan Docker internal,
# sehingga header CF-Connecting-IP boleh dipercaya untuk mengetahui IP pengguna sebenarnya
# (dipakai audit trail dan pembatas login).
map $scheme $hsts_header {
    # TLS diakhiri di Cloudflare; pengguna selalu mengakses lewat HTTPS
    default "max-age=31536000";
}

set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/itec-app.conf;
}
