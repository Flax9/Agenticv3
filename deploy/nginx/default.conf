# Mode HTTP: dipakai di laptop / jaringan lokal selama domain & sertifikat belum ada.
# Untuk HTTPS gunakan https.conf (lihat compose.https.yml dan deploy/certs/README.md).
map $scheme $hsts_header {
    default "";
}

server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/itec-app.conf;
}
