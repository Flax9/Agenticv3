[project]
name = "itec-backend"
version = "3.0.0"
description = "Backend FastAPI Pertamina Procurement AI Copilot (ITeC)"
requires-python = ">=3.12,<3.13"
# Versi disamakan dengan uv.lock Agentic_Rag_Pertamina_camp agar perilaku modul AI identik
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "python-multipart==0.0.32",
    "pydantic==2.12.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "pypdf==6.19.0",
    "docling==2.130.0",
    "langchain-core==1.6.4",
    "langchain-openrouter==0.2.8",
    "langchain-huggingface==1.2.2",
    "langchain-qdrant==1.1.0",
    "langchain-community==0.4.2",
    "langchain-experimental==0.4.2",
    "langgraph==1.2.12",
    "qdrant-client==1.19.1",
    "sentence-transformers==6.1.0",
    # Dideklarasikan langsung agar sumber CPU di [tool.uv.sources] berlaku (versi = lock camp)
    "torch==2.14.1",
    "torchvision==0.29.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2.1",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx==0.28.1",
    "ruff",
    "pytest-asyncio>=0.25",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
# Modul hasil porting belum dirapikan; lint ketat diterapkan ke kode baru dulu
extend-exclude = ["app/services/rag", "app/services/tender", "app/services/contract", "app/services/agent"]

[tool.ruff.lint.flake8-bugbear]
# Idiom FastAPI: File(...)/Form(...) di default argumen adalah deklarasi parameter, bukan nilai mutable
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]

# Di Linux (image Docker) torch dari PyPI ikut menarik library CUDA ±3 GB. Server tidak memakai GPU,
# jadi build CPU dipakai. Windows/macOS tetap memakai PyPI (sudah versi CPU).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
