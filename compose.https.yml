# Tambahan untuk mode HTTPS. Pakai setelah sertifikat ada di deploy/certs/ (lihat README di sana)
# dan COOKIE_SECURE=true di .env:
#   docker compose -f docker-compose.yml -f compose.https.yml up -d --build
services:
  nginx:
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
